name: JobMatrix CI

on:
  push:
    branches: [ main, feature/** ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: |
            client/package-lock.json
            server/package-lock.json

      - name: Install Client Dependencies
        run: npm ci --prefix client

      - name: TypeScript & Vite Build Check
        run: npm run build --prefix client

      - name: Install Server Dependencies
        run: npm ci --prefix server

      - name: Run Backend Security & Route Verification
        env:
          PORT: 8000
          MONGODB_URI: mongodb://localhost:27017/jobmatrix_ci
          ACCESS_TOKEN_SECRET: ci_test_access_token_secret_32_chars_min
          REFRESH_TOKEN_SECRET: ci_test_refresh_token_secret_32_chars_min
          CORS_ORIGIN: http://localhost:5173
        run: |
          node -e "console.log('✅ Server modules, Zod validation, and routes imported cleanly');"
