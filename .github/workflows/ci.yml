name: JobMatrix CI

on:
  push:
    branches: [ main, feature/** ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd mongosh
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: |
            client/package-lock.json
            server/package-lock.json

      - name: Install Client Dependencies
        run: npm ci --prefix client

      - name: TypeScript & Vite Build Check
        run: npm run build --prefix client

      - name: Install Server Dependencies
        run: npm ci --prefix server

      - name: Start Server & Run Verification Suites
        env:
          PORT: 8000
          NODE_ENV: test
          MONGODB_URI: mongodb://127.0.0.1:27017
          ACCESS_TOKEN_SECRET: ci_test_access_token_secret_32_chars_min
          REFRESH_TOKEN_SECRET: ci_test_refresh_token_secret_32_chars_min
          ACCESS_TOKEN_EXPIRATION: 15m
          REFRESH_TOKEN_EXPIRATION: 7d
          CORS_ORIGIN: http://localhost:5173
          API_BASE_URL: http://127.0.0.1:8000/api/v1
        run: |
          node server/src/index.js &
          SERVER_PID=$!
          npx --yes wait-on http://127.0.0.1:8000/health -t 30000
          echo "=== 🛡️ Running Security & RBAC Audit Suite (26 Checks) ==="
          npm run test:security
          echo "=== 🚀 Running E2E Application Flow Suite (16 Checks) ==="
          npm run test:flow
          kill $SERVER_PID || true

